[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# contains the JavaScript of the n8n Code nodes and n8n expressions as strings – kept readable as one line each
"n8n/build_workflows.py" = ["E501"]
