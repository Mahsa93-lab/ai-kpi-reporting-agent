# KPI reporting agent: n8n + MCP server + Mailpit (local test inbox)
#   docker compose up -d --build
#   docker compose exec n8n sh /home/node/setup/setup.sh && docker compose restart n8n
#   n8n: http://localhost:5678   ·   Mailpit (all e-mails): http://localhost:8025
name: kpi-agent

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"            # only reachable from this PC
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}  # read only by n8n/setup.sh; n8n blocks env access in workflows
      WEBHOOK_URL: http://localhost:5678/  # base of the approval links in the e-mails
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/runs
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/setup:ro          # workflows + setup.sh from this repo
      - ./runs:/home/node/runs             # one JSON log per report run
    depends_on:
      - mcp
      - mailpit

  mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"            # optional: for MCP Inspector or another MCP client on this PC
    environment:
      REGULATION_API_URL: ${REGULATION_API_URL:-http://host.docker.internal:8000}  # project 3 (optional)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data:ro                # gold tables exported from project 2

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"            # web inbox; SMTP (1025) stays inside the compose network

volumes:
  n8n_data:
